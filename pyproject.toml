[project]
name = "inference-engine"
version = "0.1.0"
description = "Learning GPU kernels and LLM inference systems"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<3",
    "numpy>=1.26,<3",
    "transformers>=4.45,<5",
    "safetensors>=0.4",
    "huggingface-hub>=0.26,<1",
]

[project.scripts]
tiny-infer = "inference_engine.cli:main"

[project.optional-dependencies]
cpu = ["torch==2.14.0"]
cuda124 = ["torch==2.6.0; sys_platform == 'linux' or sys_platform == 'win32'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda124" }]]

# Explicit accelerator extras prevent a CUDA install from resolving to CPU wheels.
# macOS uses its normal PyPI build (including MPS).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu124", extra = "cuda124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
